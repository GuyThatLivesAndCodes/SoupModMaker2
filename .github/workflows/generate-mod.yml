name: Generate Test Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/main/java/com/soupmodmaker/generators/**'
      - 'src/main/resources/templates/**'

jobs:
  generate-mod:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Build SoupModMaker2
      run: gradle build --no-daemon

    - name: Generate test mod
      run: gradle run --no-daemon --args="--full-demo"

    - name: Upload generated mod
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: generated-testmod
        path: generated/
        retention-days: 30

    - name: Show generated files
      run: |
        echo "Generated mod structure:"
        find generated -type f -name "*.java" -o -name "*.gradle" -o -name "mcmod.info" | sort
